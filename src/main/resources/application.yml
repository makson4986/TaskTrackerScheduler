spring:
  profiles:
    active: dev
  application:
    name: TaskTrackerScheduler
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: ${KAFKA_BROKER_URL}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringSerializer
    topics:
      summarization-requests: ${KAFKA_SUMMARIZATION_REQUESTS_TOPIC}
      summarization-responses: ${KAFKA_SUMMARIZATION_RESPONSES_TOPIC}
      email-sending-tasks: ${KAFKA_EMAIL_SENDING_TASKS_TOPIC}
task-service-url: ${TASK_BACKEND_URL}

