spring:
  application:
    name: TaskTrackerScheduler
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME_SCHEDULER}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml
  kafka:
    bootstrap-servers: ${KAFKA_BROKER_URL}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.type.mapping: user_tasks:org.makson.tasktrackerscheduler.dto.UserTasksDto,report:org.makson.tasktrackerscheduler.dto.ReportDto
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.type.mapping: report:org.makson.tasktrackerscheduler.dto.ReportDto
    topics:
      summarization-requests: ${KAFKA_SUMMARIZATION_REQUESTS_TOPIC}
      summarization-responses: ${KAFKA_SUMMARIZATION_RESPONSES_TOPIC}
      report: ${KAFKA_REPORT_TOPIC}
task-service-url: ${TASK_BACKEND_URL}
